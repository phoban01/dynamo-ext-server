# Settings of this member cluster. Each cluster sets its own clusterID.
# The defaults are D = 30s and M = D / 10, spec 7.3 and 7.5.
apiVersion: v1
kind: ConfigMap
metadata:
  name: solas-member
  namespace: solas-system
data:
  clusterID: change-me
  leaseDuration: 30s
  leaseMargin: 3s
  sweepInterval: 10s
