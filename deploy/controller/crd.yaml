apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deviceclaims.claims.solas.dev
spec:
  group: claims.solas.dev
  scope: Namespaced
  names:
    kind: DeviceClaim
    listKind: DeviceClaimList
    plural: deviceclaims
    singular: deviceclaim
    shortNames: [dc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Device, type: string, jsonPath: .status.deviceName}
        - {name: Priority, type: integer, jsonPath: .spec.priority}
        - {name: Token, type: integer, jsonPath: .status.fencingToken}
        - {name: Expires, type: string, jsonPath: .status.leaseExpiresAt}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                priority:
                  description: A higher number is more urgent, and may preempt a preemptible device held at a lower priority.
                  type: integer
                  format: int32
                selector:
                  description: Matches Device labels and a CEL expression. Empty matches every device.
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties: {type: string}
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        required: [key, operator]
                        properties:
                          key: {type: string}
                          operator: {type: string}
                          values:
                            type: array
                            items: {type: string}
                    cel:
                      description: A CEL expression over the variable device. The device matches when it is true.
                      type: string
                      maxLength: 4096
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Bound, Preempting, Preempted, Suspended, Lost]
                deviceName: {type: string}
                leaseExpiresAt: {type: string, format: date-time}
                preemptionSeenAt: {type: string, format: date-time}
                preemptionTarget: {type: string}
                memberUID: {type: string}
                fencingToken:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
