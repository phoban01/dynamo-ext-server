apiVersion: apps/v1
kind: Deployment
metadata:
  name: solas-controller
  namespace: solas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solas-controller
  template:
    metadata:
      labels:
        app: solas-controller
    spec:
      serviceAccountName: solas-controller
      containers:
        - name: controller
          image: solas-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --cluster-id=$(CLUSTER_ID)
            - --lease-duration=$(LEASE_DURATION)
            - --lease-margin=$(LEASE_MARGIN)
            - --sweep-interval=$(SWEEP_INTERVAL)
          env:
            # Each member cluster sets its own ID in this ConfigMap.
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef: {name: solas-member, key: clusterID}
            - name: LEASE_DURATION
              valueFrom:
                configMapKeyRef: {name: solas-member, key: leaseDuration}
            - name: LEASE_MARGIN
              valueFrom:
                configMapKeyRef: {name: solas-member, key: leaseMargin}
            - name: SWEEP_INTERVAL
              valueFrom:
                configMapKeyRef: {name: solas-member, key: sweepInterval}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
