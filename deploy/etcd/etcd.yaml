# One etcd for a single-cluster run, as deploy/dynamodb-local is for
# DynamoDB. It keeps its data in an emptyDir, so the data goes with the
# Pod. The storage URL is etcd://etcd.solas-system.svc:2379.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: solas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.6.14
          imagePullPolicy: IfNotPresent
          command:
            - etcd
            - --name=etcd
            - --data-dir=/var/lib/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd.solas-system.svc:2379
          ports:
            - containerPort: 2379
          readinessProbe:
            httpGet: {path: /health, port: 2379}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: solas-system
spec:
  selector:
    app: etcd
  ports:
    - port: 2379
