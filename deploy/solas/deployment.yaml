# One Deployment runs solas, ADR 0012. Every replica serves the API. Only
# the replica that holds the leader election lease runs the controller
# part. It needs the ConfigMap solas-member, the Secret solas-storage
# (see config/), and the Secret solas-tls from hack/gen-certs.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solas
  namespace: solas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solas
  template:
    metadata:
      labels:
        app: solas
    spec:
      serviceAccountName: solas
      containers:
        - name: solas
          image: solas:dev
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=8443
            - --tls-cert-file=/certs/tls.crt
            - --tls-private-key-file=/certs/tls.key
            - --storage-url=$(STORAGE_URL)
            - --cluster-id=$(CLUSTER_ID)
            - --lease-duration=$(LEASE_DURATION)
            - --lease-margin=$(LEASE_MARGIN)
            - --sweep-interval=$(SWEEP_INTERVAL)
          env:
            # The store and its credentials come from this Secret, so each
            # member cluster can point at the shared store. The AWS keys are
            # optional: an etcd store needs none, and on AWS a role can
            # give them.
            - name: STORAGE_URL
              valueFrom:
                secretKeyRef: {name: solas-storage, key: url}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: solas-storage, key: accessKeyID, optional: true}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: solas-storage, key: secretAccessKey, optional: true}
            # Each member cluster sets its own ID in this ConfigMap.
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef: {name: solas-member, key: clusterID}
            - name: LEASE_DURATION
              valueFrom:
                configMapKeyRef: {name: solas-member, key: leaseDuration}
            - name: LEASE_MARGIN
              valueFrom:
                configMapKeyRef: {name: solas-member, key: leaseMargin}
            - name: SWEEP_INTERVAL
              valueFrom:
                configMapKeyRef: {name: solas-member, key: sweepInterval}
          ports:
            - containerPort: 8443
          # The probes check the API server part. When the controller part
          # stops, the process exits.
          readinessProbe:
            httpGet: {path: /readyz, port: 8443, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /livez, port: 8443, scheme: HTTPS}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: solas-tls
---
apiVersion: v1
kind: Service
metadata:
  name: solas
  namespace: solas-system
spec:
  selector:
    app: solas
  ports:
    - port: 443
      targetPort: 8443
