apiVersion: v1
kind: ServiceAccount
metadata:
  name: solas
  namespace: solas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: solas
rules:
  # The API server part reads these for admission and flow control.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["prioritylevelconfigurations", "flowschemas"]
    verbs: ["list", "watch"]
  # The controller part reads and writes these.
  - apiGroups: ["claims.solas.dev"]
    resources: ["deviceclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["claims.solas.dev"]
    resources: ["deviceclaims/status", "deviceclaims/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["solas.dev"]
    resources: ["devices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["solas.dev"]
    resources: ["devices/status"]
    verbs: ["get", "update"]
  - apiGroups: ["solas.dev"]
    resources: ["members"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["solas.dev"]
    resources: ["members/status"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: solas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: solas
subjects:
  - kind: ServiceAccount
    name: solas
    namespace: solas-system
---
# Delegated authentication and authorization to the kube-apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: solas:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: solas
    namespace: solas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solas-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: solas
    namespace: solas-system
---
# The leader election lease of the controller part lives in this
# cluster, spec 6.2.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solas-leader-election
  namespace: solas-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solas-leader-election
  namespace: solas-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solas-leader-election
subjects:
  - kind: ServiceAccount
    name: solas
    namespace: solas-system
