# An example of an old Device CRD kept in a cluster's etcd.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devices.inventory.example.com
spec:
  group: inventory.example.com
  scope: Cluster
  names:
    kind: Device
    listKind: DeviceList
    plural: devices
    singular: device
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description: {type: string}
            status:
              type: object
              properties:
                owner: {type: string}
