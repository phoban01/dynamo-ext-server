apiVersion: v1
kind: ServiceAccount
metadata:
  name: solas-pivot
  namespace: solas-system
---
# The webhook reads the old resource and writes solas Devices. Change the
# first rule when the old resource is not devices.inventory.example.com.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: solas-pivot
rules:
  - apiGroups: ["inventory.example.com"]
    resources: ["devices"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["solas.dev"]
    resources: ["devices"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: solas-pivot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: solas-pivot
subjects:
  - kind: ServiceAccount
    name: solas-pivot
    namespace: solas-system
